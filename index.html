<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VEDIK CA Payroll — Login</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="styles.css"></head><body><div class="login-page"><section class="login-card"><div class="login-logo"><i class="bi bi-people-fill me-2"></i>VEDIK CA Payroll</div><p class="login-subtitle">Secure payroll and workforce management</p>
<div id="loginMessage" class="alert alert-danger d-none py-2 mb-3" role="alert"></div>
<div id="setPasswordPanel" class="d-none"><p id="setPasswordIntro" class="text-center text-muted small mb-3"><i class="bi bi-key me-1"></i>Welcome! Please set a password for your account.</p><label class="form-label fw-medium">New Password</label><div class="input-group mb-3"><span class="input-group-text"><i class="bi bi-lock"></i></span><input id="newPassword" type="password" class="form-control" placeholder="Min 8 characters"><button class="btn btn-outline-secondary" type="button" data-toggle="newPassword"><i class="bi bi-eye"></i></button></div><label class="form-label fw-medium">Confirm Password</label><div class="input-group mb-4"><span class="input-group-text"><i class="bi bi-lock-fill"></i></span><input id="confirmPassword" type="password" class="form-control" placeholder="Re-enter password"></div><button id="setPasswordBtn" class="btn btn-success w-100 py-2"><span id="setPasswordSpinner" class="spinner-border spinner-border-sm me-2 d-none"></span><i class="bi bi-check-circle me-1"></i><span id="setPasswordLabel">Set Password & Sign In</span></button></div>
<div id="forgotPasswordPanel" class="d-none"><p class="text-center text-muted small mb-3"><i class="bi bi-envelope-paper me-1"></i>Enter your email and we will send a password reset link.</p><label class="form-label fw-medium">Email Address</label><div class="input-group mb-4"><span class="input-group-text"><i class="bi bi-envelope"></i></span><input id="forgotEmail" type="email" class="form-control" autocomplete="email"></div><button id="sendResetBtn" class="btn btn-primary w-100 py-2"><span id="resetSpinner" class="spinner-border spinner-border-sm me-2 d-none"></span><i class="bi bi-send me-1"></i>Send Reset Link</button><p class="text-center small mt-3 mb-0"><a href="#" id="backToLogin">Back to Sign In</a></p></div>
<form id="loginForm" novalidate><label class="form-label fw-medium">Email Address</label><div class="input-group mb-3"><span class="input-group-text"><i class="bi bi-envelope"></i></span><input id="email" type="email" class="form-control" placeholder="you@example.com" required autocomplete="email"></div><label class="form-label fw-medium">Password</label><div class="input-group mb-3"><span class="input-group-text"><i class="bi bi-lock"></i></span><input id="password" type="password" class="form-control" placeholder="••••••••" required autocomplete="current-password"><button class="btn btn-outline-secondary" type="button" data-toggle="password" title="Show/hide password"><i class="bi bi-eye"></i></button></div><div class="mb-4 d-flex justify-content-between align-items-center"><div class="form-check"><input id="rememberMe" class="form-check-input" type="checkbox"><label class="form-check-label text-muted" for="rememberMe">Remember me</label></div><a id="forgotPasswordLink" href="#" class="small">Forgot password?</a></div><button id="loginBtn" class="btn btn-primary w-100 py-2"><span id="loginSpinner" class="spinner-border spinner-border-sm me-2 d-none"></span><i class="bi bi-box-arrow-in-right me-1"></i>Sign In</button></form>
<div id="loginFooter"><hr class="my-3"><p class="text-center small mb-2">New here? <a href="signup.html" class="fw-medium">Create a firm account</a></p><p class="text-center text-muted small mb-0"><i class="bi bi-shield-lock me-1"></i>Secured by Supabase Authentication</p></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script></body></html>
