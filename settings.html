<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organisation Settings — VEDIK CA Payroll</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="styles.css"></head><body><aside><div class="brand"><b>V</b><span>VEDIK CA<small>PAYROLL</small></span></div><div class="org"><small>ORGANISATION</small><strong id="tenantName">Payroll Organisation</strong><span>Organisation Settings</span></div><nav><a class="settings-nav-link" href="dashboard.html">⌂ Dashboard</a><a class="settings-nav-link on" href="settings.html">⚙ Organisation Settings</a></nav><div class="adminlinks"><a href="users.html">Users & Roles</a><a href="platform-admin.html" id="platformLink">Vendor Administration</a><button onclick="payrollLogout()">Logout</button></div><div class="user"><i>AD</i><span><b id="userEmail">Payroll User</b><small id="userRole">User</small></span></div></aside>
<main><header><div><h1>Organisation Settings</h1><p>Information used in payroll reports, salary slips and statutory records</p></div></header><div id="settingsAlert"></div><section class="panel settings-panel"><form id="organisationForm"><div class="settings-grid"><label>Legal name<input name="legal_name" required></label><label>Trade name<input name="trade_name"></label><label>Address line 1<input name="address_line1"></label><label>Address line 2<input name="address_line2"></label><label>City<input name="city"></label><label>State<input name="state"></label><label>PIN code<input name="pincode" maxlength="6"></label><label>Phone<input name="phone"></label><label>Email<input name="email" type="email"></label><label>Website<input name="website"></label><label>PAN<input name="pan" maxlength="10"></label><label>GSTIN<input name="gstin" maxlength="15"></label><label>PF establishment code<input name="pf_code"></label><label>ESI employer code<input name="esi_code"></label><label>Bank name<input name="bank_name"></label><label>Bank account<input name="bank_account"></label><label>IFSC<input name="ifsc" maxlength="11"></label></div><div class="modalactions"><button id="saveOrganisation" type="submit">Save organisation settings</button></div></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/session.js"></script><script src="js/settings.js"></script></body></html>
