<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users & Roles — VEDIK Payroll</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="styles.css"></head><body><main class="container py-4"><div class="d-flex justify-content-between mb-4"><div><h3>Users & Roles</h3><p class="text-muted">Create and manage vendor users and payroll permissions</p></div><a class="btn btn-outline-primary align-self-start" href="dashboard.html">Back</a></div><div id="userAlert"></div><div class="row g-4"><div class="col-lg-5"><section class="card"><div class="card-header"><b id="userFormTitle">Create User</b></div><div class="card-body"><form id="userForm"><input name="user_id" type="hidden"><label class="form-label">Full name</label><input name="name" class="form-control mb-3" required><label class="form-label">Email</label><input name="email" type="email" class="form-control mb-3" required><label class="form-label">Role</label><select name="role" id="roleSelect" class="form-select mb-3" required></select><label class="form-label">Password</label><input name="password" id="userPassword" type="password" minlength="8" class="form-control" autocomplete="new-password"><div id="passwordHelp" class="form-text mb-3">Minimum 8 characters. The user can sign in immediately.</div><div id="invitationOption" class="form-check mb-3"><input name="send_invitation" class="form-check-input" type="checkbox" id="sendInvitation"><label class="form-check-label" for="sendInvitation">Send invitation instead of fixing a password</label></div><div class="d-flex gap-2"><button id="userSave" class="btn btn-primary">Create & Activate User</button><button id="userCancel" type="button" class="btn btn-outline-secondary d-none">Cancel edit</button></div></form></div></section></div><div class="col-lg-7"><section class="card"><div class="card-header"><b>Organisation Users</b></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody id="userRows"></tbody></table></div></section></div></div><section class="card mt-4"><div class="card-header"><b>Role Permissions</b></div><div class="card-body" id="roleCards"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/session.js"></script><script src="js/users.js"></script></body></html>
