<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VEDIK CA Payroll</title><link rel="stylesheet" href="styles.css"></head><body>
<aside><div class="brand"><b>V</b><span>VEDIK CA<small>PAYROLL</small></span></div><div class="org"><small>ORGANISATION</small><strong id="tenantName">Payroll Organisation</strong><span>FY 2026–27</span></div><nav id="nav"></nav><div class="adminlinks"><a href="users.html">Users & Roles</a><a href="platform-admin.html" id="platformLink">Vendor Administration</a><button onclick="payrollLogout()">Logout</button></div><div class="user"><i>AD</i><span><b id="userEmail">Payroll User</b><small id="userRole">User</small></span></div></aside>
<main><header><div><h1 id="pageTitle">Dashboard</h1><p id="pageSub">Your payroll command centre</p></div><label>PAYROLL MONTH<input id="month" type="month" value="2026-07"></label></header><div id="toast"></div><div id="view"></div></main>
<dialog id="staffDialog"><form id="staffForm" method="dialog"><div class="modalhead"><span><h2>Add employee</h2><p>Create staff master and salary structure</p></span><button value="cancel">×</button></div><div class="formgrid"><label>Employee name<input name="name" required></label><label>Employee code<input name="code" required></label><label>Designation<input name="role"></label><label>Department<select name="dept"><option>Accounts</option><option>Audit</option><option>Taxation</option><option>Administration</option></select></label><label>Bank<input name="bank"></label><label>Branch<input name="branch"></label><label>Account number<input name="account"></label><label>IFSC<input name="ifsc"></label><label>Basic<input name="basic" type="number" required></label><label>DA<input name="da" type="number" value="0"></label><label>HRA<input name="hra" type="number" value="0"></label><label>Other allowance<input name="other" type="number" value="0"></label><label>EPF<input name="epf" type="number" value="0"></label><label>ESI<input name="esi" type="number" value="0"></label><label>PT<input name="pt" type="number" value="0"></label><label>TDS<input name="tds" type="number" value="0"></label><label>Permitted leave/month<input name="permitted" type="number" value="1"></label></div><div class="modalactions"><button value="cancel" class="secondary">Cancel</button><button value="default">Save employee</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/session.js"></script><script src="app.js"></script></body></html>
