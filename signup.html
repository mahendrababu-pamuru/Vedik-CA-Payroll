<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VEDIK CA Payroll — Create Firm Account</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="styles.css"></head><body><div class="login-page"><section class="login-card"><div class="login-logo"><i class="bi bi-people-fill me-2"></i>VEDIK CA Payroll</div><p class="login-subtitle">Create your firm's payroll account</p><div id="signupError" class="alert alert-danger d-none py-2 mb-3"></div><div id="signupSuccess" class="alert alert-success d-none py-2 mb-3"></div><form id="signupForm" novalidate><label class="form-label fw-medium">Firm Name</label><div class="input-group mb-3"><span class="input-group-text"><i class="bi bi-building"></i></span><input id="firmName" class="form-control" placeholder="Firm or organisation name" required></div><label class="form-label fw-medium">Your Name</label><div class="input-group mb-3"><span class="input-group-text"><i class="bi bi-person"></i></span><input id="fullName" class="form-control" placeholder="Your full name" autocomplete="name" required></div><label class="form-label fw-medium">Email Address</label><div class="input-group mb-3"><span class="input-group-text"><i class="bi bi-envelope"></i></span><input id="signupEmail" type="email" class="form-control" placeholder="you@example.com" autocomplete="email" required></div><label class="form-label fw-medium">Password</label><div class="input-group mb-4"><span class="input-group-text"><i class="bi bi-lock"></i></span><input id="signupPassword" type="password" class="form-control" placeholder="Min 8 characters" autocomplete="new-password" required><button id="toggleSignupPassword" class="btn btn-outline-secondary" type="button"><i class="bi bi-eye"></i></button></div><button id="signupBtn" class="btn btn-primary w-100 py-2"><span id="signupSpinner" class="spinner-border spinner-border-sm me-2 d-none"></span><i class="bi bi-person-plus me-1"></i>Create Account</button></form><hr class="my-3"><p class="text-center small mb-0">Already have an account? <a href="index.html" class="fw-medium">Sign in</a></p></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/signup.js"></script></body></html>
