<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor Administration — VEDIK Payroll</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="styles.css"></head><body><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h3>Vendor & Subscription Administration</h3><p class="text-muted mb-0">Platform administrator console</p></div><a class="btn btn-outline-primary" href="dashboard.html">Back to Payroll</a></div><div id="adminAlert"></div><section class="card mb-4"><div class="card-header"><b>Create Vendor</b></div><div class="card-body"><form id="vendorForm" class="row g-3"><div class="col-md-4"><label class="form-label">Vendor/Firm name</label><input name="name" class="form-control" required></div><div class="col-md-4"><label class="form-label">Owner email</label><input name="email" type="email" class="form-control" required></div><div class="col-md-2"><label class="form-label">Plan</label><select name="plan" class="form-select"><option>trial</option><option>starter</option><option>professional</option><option>enterprise</option></select></div><div class="col-md-2"><label class="form-label">Valid to</label><input name="valid_to" type="date" class="form-control"></div><div class="col-12"><button class="btn btn-primary"><i class="bi bi-building-add"></i> Create vendor & invite owner</button></div></form></div></section><section class="card"><div class="card-header"><b>Vendors and subscriptions</b></div><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Vendor</th><th>Owner</th><th>Plan</th><th>Valid to</th><th>Status</th><th>Actions</th></tr></thead><tbody id="vendorRows"></tbody></table></div></section></main><script src="https:/
